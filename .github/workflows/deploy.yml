name: Scheduled Data Ingestion & Deploy to GitHub Pages

on:
  schedule:
    # Ingests fresh data and redeploys every 4 hours (best-effort cadence)
    - cron: "0 */4 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingestion dry-run verification
        run: node scripts/sync-data.js --dry-run

      - name: Run validated ingestion pipeline
        run: node scripts/sync-data.js

      - name: Check code formatting, linting, and types
        run: ./node_modules/.bin/vp check --fix

      - name: Verify data integrity and run unit tests
        run: ./node_modules/.bin/vp test --run

      - name: Install Playwright browsers and dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E behavioral tests
        run: ./node_modules/.bin/vp run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-deploy
          path: playwright-report/
          retention-days: 7

      - name: Persist validated data for the next run (after CI passes)
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data src/data/outbreak-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated validated outbreak sync [skip ci]" && git push origin master)

      - name: Build static site
        run: ./node_modules/.bin/vp run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: ingest-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
