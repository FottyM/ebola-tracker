name: CI — Automated Tests & Quality Verification

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingestion dry-run verification
        run: node scripts/sync-data.js --dry-run

      - name: Check code formatting, linting, and types
        run: ./node_modules/.bin/vp check

      - name: Run unit and integration tests
        run: ./node_modules/.bin/vp test --run

      - name: Install Playwright browsers and dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E behavioral tests
        run: ./node_modules/.bin/vp run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: playwright-report/
          retention-days: 7

      - name: Verify static build
        run: ./node_modules/.bin/vp run build:pages
