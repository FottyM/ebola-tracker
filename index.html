<!doctype html>
<html lang="en">
  <head>

    <!-- Primary SEO Meta Tags -->
    <title>2026 Bundibugyo Ebola Outbreak — DRC & Central Africa Live Tracker (Vite+)</title>
    <meta
      name="title"
      content="2026 Bundibugyo Ebola Outbreak — DRC & Central Africa Live Tracker (Vite+)"
    />
    <meta
      name="description"
      content="Official epidemiological situation map and tracking data for the 2026 Bundibugyo ebolavirus outbreak in DRC. Real-time statistics from ECDC, Africa CDC, and WHO."
    />
    <meta
      name="keywords"
      content="Ebola, Bundibugyo, DRC, Congo, Outbreak 2026, ECDC, WHO, Africa CDC, Epidemic, Health Map, Vite+"
    />
    <meta name="robots" content="index, follow" />

    <!-- Performance & Preload Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/style.css" />

    <!-- Structured Data JSON-LD for Search Engines -->
    <!--ssr-jsonld-start-->
    <!--ssr-jsonld-->
    <!--ssr-jsonld-end-->
  </head>
  <body>
    <!-- SSR pre-rendered content placeholder -->
    <!--ssr-outlet-start-->
    <!--ssr-outlet-->
    <!--ssr-outlet-end-->

    <!-- Injected Initial Data from Backend ETL -->
    <script id="ssr-state-data" type="application/json">
      <!--ssr-state-start-->
      <!--ssr-state-->
      <!--ssr-state-end-->
    </script>
    <script>
      (function () {
        try {
          var el = document.getElementById("ssr-state-data");
          var raw = el ? el.textContent.trim() : "";
          if (raw && !raw.startsWith("<!--")) {
            window.__INITIAL_DATA__ = JSON.parse(raw);
          }
        } catch (e) {
          console.warn("SSR initial state parse warning:", e);
        }
      })();
    </script>

    <!-- Client Hydration & Bundled Leaflet -->
    <script type="module" src="/src/entry-client.js"></script>
  </body>
</html>
